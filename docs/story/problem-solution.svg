<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="440" rx="18" fill="#ffffff"/>

  <!-- LEFT: today -->
  <rect x="20" y="20" width="430" height="400" rx="14" fill="#fdecea"/>
  <text x="235" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#b3261e">TODAY</text>

  <!-- pile of documents -->
  <g stroke="#9e9e9e" stroke-width="1.5">
    <rect x="70" y="150" width="120" height="150" rx="6" fill="#ffffff" transform="rotate(-8 130 225)"/>
    <rect x="85" y="140" width="120" height="150" rx="6" fill="#ffffff" transform="rotate(5 145 215)"/>
    <rect x="95" y="130" width="120" height="150" rx="6" fill="#ffffff"/>
  </g>
  <g stroke="#bdbdbd" stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="160" x2="198" y2="160"/><line x1="112" y1="178" x2="190" y2="178"/>
    <line x1="112" y1="196" x2="198" y2="196"/><line x1="112" y1="214" x2="175" y2="214"/>
    <line x1="112" y1="232" x2="198" y2="232"/><line x1="112" y1="250" x2="185" y2="250"/>
  </g>
  <text x="155" y="122" text-anchor="middle" font-size="15" font-weight="700" fill="#333">4,000+ schemes</text>
  <text x="155" y="330" text-anchor="middle" font-size="14" fill="#555">long PDFs, mostly English</text>

  <!-- person (simple) -->
  <circle cx="340" cy="170" r="26" fill="#8d6e63"/>
  <path d="M300 280 q40 -90 80 0 z" fill="#c2185b"/>
  <text x="340" y="105" text-anchor="middle" font-size="40" font-weight="700" fill="#b3261e">?</text>
  <text x="340" y="312" text-anchor="middle" font-size="15" font-weight="700" fill="#333">Sunita, 38, widow</text>
  <text x="340" y="332" text-anchor="middle" font-size="13" fill="#555">studied till class 8</text>

  <text x="235" y="378" text-anchor="middle" font-size="16" fill="#333">"Which of these are mine?"</text>
  <text x="235" y="402" text-anchor="middle" font-size="14" fill="#b3261e" font-weight="700">Money meant for her is never claimed.</text>

  <!-- arrow -->
  <path d="M458 220 h36" stroke="#333" stroke-width="5"/>
  <path d="M494 206 l18 14 l-18 14 z" fill="#333"/>

  <!-- RIGHT: with SchemeMatch -->
  <rect x="520" y="20" width="420" height="400" rx="14" fill="#e8f5e9"/>
  <text x="730" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#1b5e20">WITH SCHEMEMATCH</text>

  <!-- phone -->
  <rect x="550" y="85" width="150" height="290" rx="20" fill="#263238"/>
  <rect x="560" y="105" width="130" height="245" rx="8" fill="#ffffff"/>
  <circle cx="625" cy="300" r="22" fill="#1b5e20"/>
  <rect x="619" y="287" width="12" height="20" rx="6" fill="#ffffff"/>
  <path d="M613 300 q12 16 24 0" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  <rect x="570" y="118" width="110" height="26" rx="10" fill="#e3f2fd"/>
  <text x="625" y="136" text-anchor="middle" font-size="12" fill="#0d47a1">Your age?</text>
  <rect x="570" y="152" width="110" height="26" rx="10" fill="#e3f2fd"/>
  <text x="625" y="170" text-anchor="middle" font-size="12" fill="#0d47a1">Widow?</text>
  <rect x="570" y="186" width="110" height="26" rx="10" fill="#e3f2fd"/>
  <text x="625" y="204" text-anchor="middle" font-size="12" fill="#0d47a1">Family income?</text>
  <text x="625" y="240" text-anchor="middle" font-size="12" fill="#555">4-5 voice questions</text>
  <text x="625" y="258" text-anchor="middle" font-size="12" fill="#555">speak, don't type</text>
  
  <!-- result cards -->
  <g font-size="13">
    <rect x="720" y="100" width="215" height="62" rx="10" fill="#ffffff" stroke="#66bb6a" stroke-width="2"/>
    <text x="735" y="124" font-weight="700" fill="#1b5e20">✓ Sanjay Gandhi pension</text>
    <text x="735" y="146" fill="#555">because: widow + BPL card</text>
    <rect x="720" y="174" width="215" height="62" rx="10" fill="#ffffff" stroke="#66bb6a" stroke-width="2"/>
    <text x="735" y="198" font-weight="700" fill="#1b5e20">✓ Ladki Bahin</text>
    <text x="735" y="220" fill="#555">because: woman, income &lt; ₹2.5L</text>
    <rect x="720" y="248" width="215" height="62" rx="10" fill="#ffffff" stroke="#ffa726" stroke-width="2"/>
    <text x="735" y="272" font-weight="700" fill="#e65100">? Also confirm</text>
    <text x="735" y="294" fill="#555">"you are destitute (niradhar)"</text>
  </g>
  <text x="820" y="340" text-anchor="middle" font-size="14" fill="#333">each result shows WHY</text>
  <text x="820" y="360" text-anchor="middle" font-size="14" fill="#333">+ papers + where to go</text>
  <text x="730" y="402" text-anchor="middle" font-size="14" fill="#1b5e20" font-weight="700">Goal: she knows what she is owed in under 2 minutes.</text>
</svg>
